<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苑宝的考研基地 🌅</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --orange: #FF8C42;
    --pink: #FF6B8A;
    --purple: #C084FC;
    --deep-purple: #9B6FD1;
    --warm-light: #FFF5EB;
    --card-bg: rgba(255,255,255,0.72);
    --card-border: rgba(255,255,255,0.85);
    --text-primary: #3D2828;
    --text-secondary: #7A6060;
    --shadow-warm: 0 4px 24px rgba(255,120,80,0.13);
    --shadow-hover: 0 8px 32px rgba(255,107,138,0.22);
    --radius: 18px;
    --radius-sm: 12px;
  }

  body {
    font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', '微软雅黑', sans-serif;
    background: #1a0a0a;
    color: var(--text-primary);
    min-height: 100vh;
    padding-bottom: 60px;
    overflow-x: hidden;
  }

  /* ===== CANVAS BACKGROUND ===== */
  #bg-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* ===== NOISE TEXTURE OVERLAY ===== */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.35;
  }

  /* ===== EVERYTHING ABOVE CANVAS ===== */
  .header, .container { position: relative; z-index: 2; }

  /* ===== HEADER ===== */
  .header {
    padding: 36px 20px 30px;
    text-align: center;
    color: white;
    position: relative;
    overflow: hidden;
    z-index: 2;
  }
  .header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg,
      rgba(255,140,66,0.55) 0%,
      rgba(255,107,138,0.45) 45%,
      rgba(192,132,252,0.50) 100%);
    backdrop-filter: blur(0px);
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 40px;
    background: linear-gradient(to bottom, transparent, rgba(20,8,8,0.0));
  }
  .header-inner { position: relative; z-index: 1; }

  .header h1 {
    font-size: clamp(24px, 5vw, 34px);
    font-weight: 800;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.2);
    margin-bottom: 6px;
  }
  .header .subtitle {
    font-size: 13px;
    opacity: 0.92;
    letter-spacing: 0.3px;
    margin-bottom: 20px;
  }
  .countdown-bar {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .countdown-chip {
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 20px;
    padding: 10px 20px;
    text-align: center;
    transition: transform 0.2s;
  }
  .countdown-chip:hover { transform: translateY(-2px); }
  .countdown-chip .num {
    font-size: 26px;
    font-weight: 800;
    display: block;
    line-height: 1.1;
    text-shadow: 0 1px 8px rgba(0,0,0,0.15);
  }
  .countdown-chip .label { font-size: 11px; opacity: 0.88; }

  /* ===== CONTAINER ===== */
  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 18px 16px;
    z-index: 2;
  }

  /* ===== GLASS CARD BASE ===== */
  .glass {
    background: var(--card-bg);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-warm),
                inset 0 1px 0 rgba(255,255,255,0.6);
  }

  /* ===== DATE NAV ===== */
  .date-nav {
    padding: 14px 16px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .nav-btn {
    background: linear-gradient(135deg, var(--orange), var(--pink));
    color: white;
    border: none;
    border-radius: 14px;
    width: 42px;
    height: 42px;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    box-shadow: 0 3px 12px rgba(255,107,138,0.3);
    flex-shrink: 0;
  }
  .nav-btn:hover { transform: scale(1.1); box-shadow: 0 5px 18px rgba(255,107,138,0.45); }
  .nav-btn:active { transform: scale(0.93); opacity: 0.8; }
  .today-btn {
    background: linear-gradient(135deg, var(--purple), var(--pink));
    font-size: 12px;
    font-weight: 700;
    width: auto;
    padding: 8px 16px;
    border-radius: 12px;
    letter-spacing: 0.3px;
  }
  .date-display { text-align: center; flex: 1; }
  .date-display .main-date { font-size: 20px; font-weight: 800; color: var(--text-primary); }
  .date-display .weekday { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  /* ===== PROGRESS ===== */
  .progress-section { padding: 16px 18px; margin-bottom: 14px; }
  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .progress-title { font-size: 14px; font-weight: 700; color: var(--text-primary); }
  .progress-count { font-size: 14px; color: var(--pink); font-weight: 800; }
  .progress-track {
    background: rgba(255,180,160,0.25);
    border-radius: 12px;
    height: 12px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--orange), var(--pink), var(--purple));
    background-size: 200% 100%;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    animation: shimmer-bar 3s ease-in-out infinite;
  }
  @keyframes shimmer-bar {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    top: 2px; left: 6px; right: 6px; height: 3px;
    background: rgba(255,255,255,0.4);
    border-radius: 2px;
  }

  /* ===== SECTION TITLE ===== */
  .section-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  /* ===== TASK CARD ===== */
  .task-card {
    background: var(--card-bg);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.75);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-warm),
                inset 0 1px 0 rgba(255,255,255,0.55);
    display: flex;
    gap: 13px;
    align-items: flex-start;
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1),
                box-shadow 0.18s ease,
                opacity 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .task-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
  }
  .task-card:hover {
    transform: translateY(-2px) scale(1.005);
    box-shadow: var(--shadow-hover),
                inset 0 1px 0 rgba(255,255,255,0.65);
  }
  .task-card:active { transform: scale(0.98); }

  .task-card.completed {
    opacity: 0.52;
    background: rgba(255,255,255,0.4);
    transform: none !important;
  }
  .task-card.completed .task-text { text-decoration: line-through; color: var(--text-secondary); }

  /* ripple effect */
  .task-card .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,107,138,0.25);
    transform: scale(0);
    animation: ripple-anim 0.5s ease-out forwards;
    pointer-events: none;
  }
  @keyframes ripple-anim {
    to { transform: scale(4); opacity: 0; }
  }

  /* check circle */
  .task-check {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2.5px solid rgba(255,140,66,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
    margin-top: 1px;
    background: rgba(255,255,255,0.4);
  }
  .task-card:hover .task-check { border-color: var(--pink); transform: scale(1.1); }
  .task-card.completed .task-check {
    background: linear-gradient(135deg, var(--orange), var(--pink));
    border-color: transparent;
    box-shadow: 0 2px 10px rgba(255,107,138,0.4);
    transform: scale(1) !important;
  }
  .task-check .check-icon { display: none; }
  .task-card.completed .task-check .check-icon { display: block; animation: pop-in 0.3s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes pop-in {
    0% { transform: scale(0) rotate(-20deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .task-content { flex: 1; min-width: 0; }
  .task-tag {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 10px;
    margin-bottom: 5px;
    letter-spacing: 0.3px;
  }
  .tag-morning  { background: linear-gradient(135deg,#FFF0E0,#FFE4C8); color: #C06010; border: 1px solid rgba(255,140,66,0.2); }
  .tag-afternoon{ background: linear-gradient(135deg,#FFE8E0,#FFD8D0); color: #B04020; border: 1px solid rgba(255,100,70,0.2); }
  .tag-politics { background: linear-gradient(135deg,#FFE0E0,#FFCFCF); color: #B02020; border: 1px solid rgba(220,80,80,0.2); }
  .tag-english  { background: linear-gradient(135deg,#E0EEFF,#D0E4FF); color: #1A50C0; border: 1px solid rgba(80,130,220,0.2); }
  .tag-buffer   { background: linear-gradient(135deg,#F0E8FF,#E4D8FF); color: #7040B0; border: 1px solid rgba(160,100,220,0.2); }

  .task-text {
    font-size: 14px;
    line-height: 1.65;
    color: var(--text-primary);
    word-break: break-word;
  }

  /* ===== OVERDUE ===== */
  .overdue-section { margin-bottom: 18px; }
  .overdue-section .section-title { color: #D04040; }
  .task-card.overdue-card { border-left: 3px solid rgba(255,107,138,0.6); }
  .overdue-date { font-size: 10px; color: var(--pink); font-weight: 700; margin-bottom: 3px; }

  /* ===== EMPTY STATE ===== */
  .empty-state {
    text-align: center;
    padding: 56px 20px;
    color: var(--text-secondary);
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-warm);
  }
  .empty-state .emoji { font-size: 52px; margin-bottom: 14px; display: block; }
  .empty-state p { font-size: 14px; line-height: 1.7; }

  /* ===== ALL DONE ===== */
  .all-done {
    text-align: center;
    padding: 36px 20px;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-warm);
    margin-bottom: 12px;
  }
  .all-done .emoji { font-size: 56px; display: block; margin-bottom: 10px; animation: bounce 1s ease infinite; }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .all-done .big { font-size: 18px; font-weight: 800; color: var(--pink); margin-bottom: 6px; }
  .all-done p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

  /* ===== MOTIVATION ===== */
  .motivation {
    margin-top: 16px;
    padding: 18px 20px;
    text-align: center;
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.9;
  }
  .motivation .quote {
    font-style: italic;
    background: linear-gradient(135deg, var(--orange), var(--pink), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
    font-size: 14px;
  }

  /* ===== FLOATING PARTICLES ===== */
  .particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 500px) {
    .container { padding: 12px 12px; }
    .countdown-chip .num { font-size: 22px; }
    .countdown-chip { padding: 8px 14px; }
    .task-card { padding: 12px 14px; }
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,140,66,0.3); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,107,138,0.5); }

  /* ===== PHASE PILL ===== */
  .phase-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    font-weight: 700;
    padding: 4px 11px;
    border-radius: 20px;
    margin-bottom: 14px;
    letter-spacing: 0.3px;
  }
  .phase-course { background: rgba(255,140,66,0.15); color: #C06010; border: 1px solid rgba(255,140,66,0.3); }
  .phase-plus   { background: rgba(255,107,138,0.12); color: #B03060; border: 1px solid rgba(255,107,138,0.3); }
  .phase-final  { background: rgba(192,132,252,0.15); color: #8040C0; border: 1px solid rgba(192,132,252,0.3); }
</style>
</head>

<!-- ===== ANIMATED BACKGROUND ===== -->
<canvas id="bg-canvas"></canvas>

<!-- ===== HEADER ===== -->
<div class="header">
  <div class="header-inner">
    <h1>🌅 苑宝的考研基地</h1>
    <div class="subtitle">吉林大学新闻传播学硕 · 二战必胜 · 距离梦想只差一步 💪</div>
    <div class="countdown-bar">
      <div class="countdown-chip">
        <span class="num" id="countdown-days">—</span>
        <span class="label">天后考试</span>
      </div>
      <div class="countdown-chip">
        <span class="num" id="study-days">—</span>
        <span class="label">已学习天</span>
      </div>
      <div class="countdown-chip">
        <span class="num" id="total-checked">—</span>
        <span class="label">已完成任务</span>
      </div>
    </div>
  </div>
</div>

<div class="container">

  <!-- Date Navigation -->
  <div class="glass date-nav">
    <button class="nav-btn" onclick="changeDate(-1)" aria-label="前一天">‹</button>
    <div class="date-display">
      <div class="main-date" id="main-date"></div>
      <div class="weekday" id="weekday"></div>
    </div>
    <button class="nav-btn today-btn" onclick="goToday()">今天</button>
    <button class="nav-btn" onclick="changeDate(1)" aria-label="后一天">›</button>

  <!-- Progress -->
  <div class="glass progress-section">
    <div class="progress-header">
      <div class="progress-title">✨ 今日进度</div>
      <div class="progress-count" id="progress-count">0/0</div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>

  <!-- Overdue -->
  <div class="overdue-section" id="overdue-section" style="display:none;">
    <div class="section-title">⏰ 未完成的任务</div>
    <div id="overdue-list"></div>
  </div>

  <!-- Tasks -->
  <div id="today-section">
    <div class="section-title" id="tasks-title">📝 今日任务</div>
    <div id="task-list"></div>
  </div>

  <!-- Motivation -->
  <div class="glass motivation" id="motivation"></div>

</div>

<script>
// ===================================================================
// ANIMATED BACKGROUND
// ===================================================================
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, orbs, sparks;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  // Orbs = large soft glowing blobs
  function makeOrb() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: 180 + Math.random() * 260,
      vx: (Math.random() - 0.5) * 0.22,
      vy: (Math.random() - 0.5) * 0.18,
      hue: Math.random() < 0.5 ? 15 + Math.random() * 25 : 300 + Math.random() * 40, // orange or pink-purple
      alpha: 0.18 + Math.random() * 0.14,
      phase: Math.random() * Math.PI * 2,
      speed: 0.004 + Math.random() * 0.003
    };
  }

  // Sparks = tiny floating dots
  function makeSpark() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: 0.8 + Math.random() * 2.2,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -0.15 - Math.random() * 0.25,
      alpha: 0.3 + Math.random() * 0.5,
      fade: 0.003 + Math.random() * 0.004,
      hue: 20 + Math.random() * 320
    };
  }

  function init() {
    resize();
    orbs = Array.from({ length: 7 }, makeOrb);
    sparks = Array.from({ length: 55 }, makeSpark);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Base gradient
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0,   '#2a0d0d');
    grad.addColorStop(0.3, '#1e0a15');
    grad.addColorStop(0.6, '#130820');
    grad.addColorStop(1,   '#1a0818');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Subtle grid / geometry lines
    ctx.save();
    ctx.strokeStyle = 'rgba(255,160,100,0.025)';
    ctx.lineWidth = 0.5;
    const gap = 60;
    for (let x = 0; x < W; x += gap) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += gap) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();

    // Orbs
    const t = Date.now() * 0.001;
    orbs.forEach(o => {
      o.phase += o.speed;
      const pulse = 1 + 0.06 * Math.sin(o.phase);
      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r * pulse);
      g.addColorStop(0,   `hsla(${o.hue},85%,70%,${o.alpha})`);
      g.addColorStop(0.5, `hsla(${o.hue},70%,55%,${o.alpha * 0.4})`);
      g.addColorStop(1,   `hsla(${o.hue},60%,40%,0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r * pulse, 0, Math.PI * 2);
      ctx.fill();

      o.x += o.vx;
      o.y += o.vy;
      if (o.x < -o.r) o.x = W + o.r;
      if (o.x > W + o.r) o.x = -o.r;
      if (o.y < -o.r) o.y = H + o.r;
      if (o.y > H + o.r) o.y = -o.r;
    });

    // Sparks / floating particles
    sparks.forEach((s, i) => {
      ctx.save();
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = `hsl(${s.hue},80%,80%)`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      s.x += s.vx;
      s.y += s.vy;
      s.alpha -= s.fade;
      if (s.alpha <= 0 || s.y < -10) {
        sparks[i] = makeSpark();
        sparks[i].y = H + 5;
        sparks[i].alpha = 0.1 + Math.random() * 0.3;
      }
    });

    // Bokeh rings
    if (Math.random() < 0.012) {
      const bx = Math.random() * W;
      const by = Math.random() * H;
      const br = 8 + Math.random() * 30;
      const bh = [15, 340, 270][Math.floor(Math.random() * 3)];
      ctx.save();
      ctx.strokeStyle = `hsla(${bh},80%,80%,0.12)`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); });
  init();
  draw();
})();

const PLAN_DATA = {

    { tag: "afternoon", text: "新闻评论实务——读人民日报评论1篇+仿写100字\n⭐需读教材：新闻评论教程 第1章（评论的性质与功能）" }
  ],

// ===================================================================
// TAG CONFIG
// ===================================================================
const TAG_CONFIG = {
  morning:   { label: "☀️ 上午·理论",   cls: "tag-morning" },
  afternoon: { label: "🌤️ 下午·实务",  cls: "tag-afternoon" },
  politics:  { label: "🔴 政治",        cls: "tag-politics" },
  english:   { label: "🔵 英语",        cls: "tag-english" },
  buffer:    { label: "💜 缓冲/休息",   cls: "tag-buffer" }
};

// ===================================================================
// STATE
// ===================================================================
const EXAM_DATE  = new Date('2026-12-25');
const START_DATE = new Date('2026-04-21');
let currentDate  = new Date();
currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate());

// ===================================================================
// STORAGE
// ===================================================================
function getKey(dateStr, idx) { return `yuanbao_task_${dateStr}_${idx}`; }
function isDone(dateStr, idx) { return localStorage.getItem(getKey(dateStr, idx)) === '1'; }
function toggleTask(dateStr, idx) {
  const k = getKey(dateStr, idx);
  localStorage.getItem(k) === '1' ? localStorage.removeItem(k) : localStorage.setItem(k, '1');
  render();
}

// ===================================================================
// HELPERS
// ===================================================================
function dateToStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDate(d) { return `${d.getMonth()+1}月${d.getDate()}日`; }
function getWeekday(d) { return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]; }
function isToday(d) {
  const n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}
function daysBetween(a,b) { return Math.floor((b-a)/(1000*60*60*24)); }

// ===================================================================
// MOTIVATIONAL QUOTES
// ===================================================================
const QUOTES = [
  "每一天的坚持都在为未来的自己铺路 🌟",
  "慢慢来，比较快 🐢✨",
  "你比自己以为的更强大 💪",
  "今天的努力，是明天的底气 🌅",
  "二战不是重来，是带着经验再出发 🚀",
  "累了就歇歇，但别放弃 🌸",
  "吉大在等你，别让它等太久 📚",
  "每背一个知识点，就离梦想近一步 🎯",
  "休息也是备考的一部分 ☕",
  "你已经很棒了，继续加油 🌈",
  "学不进去的时候就出去走走，回来再战 🍃",
  "坚持到最后的人，运气都不会太差 🍀",
  "360分的你已经很厉害了，这次加10分就够了 ⭐",
  "吉大新传，苑宝的位置，早就留着了 🏛️",
  "不是考不上，是还没到时候 🌙"
];
function getMotivation() {
  const t = new Date();
  const idx = (t.getFullYear()*366 + t.getMonth()*31 + t.getDate()) % QUOTES.length;
  return QUOTES[idx];
}

// ===================================================================
// RIPPLE EFFECT
// ===================================================================
function addRipple(card, e) {
  const rect = card.getBoundingClientRect();
  const x = (e.clientX || rect.left + rect.width/2) - rect.left;
  const y = (e.clientY || rect.top  + rect.height/2) - rect.top;
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.cssText = `left:${x}px;top:${y}px;width:60px;height:60px;margin-left:-30px;margin-top:-30px;`;
  card.appendChild(r);
  setTimeout(() => r.remove(), 600);
}

// ===================================================================
// MAKE CARD
// ===================================================================
function makeCard(dateStr, task, idx, isOverdue, overdueDateStr) {
  const done = isDone(dateStr, idx);
  const tagInfo = TAG_CONFIG[task.tag] || { label: task.tag, cls: 'tag-buffer' };
  const card = document.createElement('div');
  card.className = 'task-card' + (done ? ' completed' : '') + (isOverdue ? ' overdue-card' : '');
  card.onclick = function(e) {
    addRipple(card, e);
    setTimeout(function() { toggleTask(dateStr, idx); }, 120);
  };
  const overdueHtml = isOverdue
    ? '<div class="overdue-date">📌 ' + (function(){ const d=new Date(overdueDateStr); return (d.getMonth()+1)+'月'+d.getDate()+'日'; })() + '</div>'
    : '';
  card.innerHTML = '<div class="task-check"><svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div><div class="task-content">' + overdueHtml + '<span class="task-tag ' + tagInfo.cls + '">' + tagInfo.label + '</span><div class="task-text">' + task.text.replace(/\n/g,'<br>') + '</div></div>';
  return card;
}

// ===================================================================
// RENDER
// ===================================================================
function render() {
  const dateStr = dateToStr(currentDate);
  const tasks = PLAN_DATA[dateStr] || [];
  const now = new Date();
  const todayNorm = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  document.getElementById('countdown-days').textContent = Math.max(0, daysBetween(todayNorm, EXAM_DATE));
  document.getElementById('study-days').textContent = Math.max(0, daysBetween(START_DATE, todayNorm));
  let totalChecked = 0;
  for (const k in localStorage) { if (k.startsWith('yuanbao_task_') && localStorage[k]==='1') totalChecked++; }
  document.getElementById('total-checked').textContent = totalChecked;

  document.getElementById('main-date').textContent = currentDate.getFullYear() + "年" + formatDate(currentDate);
  document.getElementById('weekday').textContent = getWeekday(currentDate) + (isToday(currentDate) ? ' · 今天' : '');

  let completed = 0;
  tasks.forEach(function(_,i) { if (isDone(dateStr,i)) completed++; });
  const total = tasks.length;
  document.getElementById('progress-count').textContent = completed + '/' + total;
  document.getElementById('progress-fill').style.width = total > 0 ? ((completed/total)*100) + '%' : '0%';

  let phaseHtml = '';
  if (dateStr < '2026-06-01') {
    phaseHtml = '<div class="phase-pill phase-course">📖 阶段一：专业课冲刺</div>';
  } else if (dateStr <= '2026-07-31') {
    phaseHtml = '<div class="phase-pill phase-plus">📖+🔴+🔵 阶段二：三线并行</div>';
  } else {
    phaseHtml = '<div class="phase-pill phase-final">🔴+🔵 阶段三：政治英语冲刺</div>';
  }

  const taskList = document.getElementById('task-list');

  if (tasks.length === 0) {
    const allDates = Object.keys(PLAN_DATA).sort();
    const inRange = dateStr >= allDates[0] && dateStr <= allDates[allDates.length-1];
    taskList.innerHTML = phaseHtml + (inRange
      ? '<div class="empty-state"><span class="emoji">🌸</span><p>今天没有安排任务<br>好好休息，养精蓄锐～</p></div>'
      : '<div class="empty-state"><span class="emoji">📅</span><p>这一天还没有安排哦～<br>计划覆盖 4月21日 到 12月24日</p></div>');
    document.getElementById('tasks-title').textContent = '📝 当日任务';
  } else {
    let done2 = 0;
    tasks.forEach(function(_,i) { if (isDone(dateStr,i)) done2++; });
    const allDone = done2 === tasks.length;

    taskList.innerHTML = phaseHtml;
    if (allDone) {
      const doneDiv = document.createElement('div');
      doneDiv.className = 'all-done';
      doneDiv.innerHTML = '<span class="emoji">🎉</span><p class="big">全部完成啦！</p><p>太棒了！今天的任务全搞定了<br>点击任务可以取消打卡</p>';
      taskList.appendChild(doneDiv);
    }

    tasks.forEach(function(task, idx) {
      const done = isDone(dateStr, idx);
      if (allDone && !done) return;
      taskList.appendChild(makeCard(dateStr, task, idx, false, null));
    });

    document.getElementById('tasks-title').textContent = isToday(currentDate) ? '📝 今日任务' : '📝 ' + formatDate(currentDate) + '的任务';
  }

  const overdueSection = document.getElementById('overdue-section');
  const overdueList = document.getElementById('overdue-list');
  if (isToday(currentDate)) {
    const overdueTasks = [];
    Object.keys(PLAN_DATA).sort().forEach(function(d) {
      if (d >= dateStr) return;
      PLAN_DATA[d].forEach(function(task, idx) {
        if (!isDone(d, idx)) overdueTasks.push({ date: d, task: task, idx: idx });
      });
    });
    if (overdueTasks.length > 0) {
      overdueSection.style.display = 'block';
      overdueList.innerHTML = '';
      overdueTasks.forEach(function(item) {
        overdueList.appendChild(makeCard(item.date, item.task, item.idx, true, item.date));
      });
    } else {
      overdueSection.style.display = 'none';
    }
  } else {
    overdueSection.style.display = 'none';
  }

  document.getElementById('motivation').innerHTML = '<span class="quote">"' + getMotivation() + '"</span>';
}

function changeDate(delta) {
  currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()+delta);
  render();
}
function goToday() {
  const n = new Date();
  currentDate = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  render();
}

render();

let touchStartX = 0;
document.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
document.addEventListener('touchend', function(e) {
  const diff = touchStartX - e.changedTouches[0].screenX;
  if (Math.abs(diff) > 80) changeDate(diff > 0 ? 1 : -1);
}, { passive: true });
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') changeDate(-1);
  if (e.key === 'ArrowRight') changeDate(1);
  if (e.key === 'Home') goToday();
});
</script>
