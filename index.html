<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --sunset-orange: #FF8C42;
    --sunset-pink: #FF6B8A;
    --sunset-purple: #C084FC;
    --sunset-light: #FFF5EB;
    --sunset-warm: #FFE8D6;
    --card-bg: rgba(255, 255, 255, 0.85);
    --text-primary: #3D2C2C;
    --text-secondary: #7A6565;
    --shadow: 0 4px 20px rgba(255, 140, 66, 0.12);
  }

  body {
    font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', '微软雅黑', sans-serif;
    background: linear-gradient(135deg, #FFE8D6 0%, #FFD6C0 15%, #FFBFA0 30%, #FFB3B3 50%, #E8B4D8 70%, #D4A5E5 85%, #C084FC 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: var(--text-primary);
    padding-bottom: 40px;
  }

  /* ===== HEADER ===== */
  .header {
    background: linear-gradient(135deg, #FF8C42 0%, #FF6B8A 50%, #C084FC 100%);
    padding: 32px 20px 28px;
    text-align: center;
    color: white;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
    animation: shimmer 8s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(30px, -20px); }
  }
  .header h1 {
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 800;
    position: relative;
    z-index: 1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .header .subtitle {
    font-size: 13px;
    opacity: 0.9;
    margin-top: 6px;
    position: relative;
    z-index: 1;
  }

  /* ===== COUNTDOWN ===== */
  .countdown-bar {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 18px;
    position: relative;
    z-index: 1;
  }
  .countdown-chip {
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 16px;
    padding: 8px 18px;
    text-align: center;
  }
  .countdown-chip .num {
    font-size: 28px;
    font-weight: 800;
    display: block;
    line-height: 1.1;
  }
  .countdown-chip .label {
    font-size: 11px;
    opacity: 0.9;
  }

  /* ===== CONTAINER ===== */
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
  }

  /* ===== DATE NAV ===== */
  .date-nav {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 14px 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255,255,255,0.6);
  }
  .date-nav button {
    background: linear-gradient(135deg, #FF8C42, #FF6B8A);
    color: white;
    border: none;
    border-radius: 12px;
    width: 40px;
    height: 40px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, box-shadow 0.15s;
    flex-shrink: 0;
  }
  .date-nav button:hover { transform: scale(1.08); box-shadow: 0 3px 12px rgba(255,107,138,0.3); }
  .date-nav button:active { transform: scale(0.95); }
  .date-display {
    text-align: center;
    flex: 1;
  }
  .date-display .main-date {
    font-size: 20px;
    font-weight: 800;
    color: var(--text-primary);
  }
  .date-display .weekday {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .date-nav .today-btn {
    background: linear-gradient(135deg, #C084FC, #FF6B8A);
    font-size: 12px;
    width: auto;
    padding: 6px 14px;
    border-radius: 10px;
    font-weight: 600;
  }

  /* ===== PROGRESS BAR ===== */
  .progress-section {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 16px 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255,255,255,0.6);
  }
  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .progress-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
  }
  .progress-count {
    font-size: 13px;
    color: var(--sunset-pink);
    font-weight: 700;
  }
  .progress-bar-bg {
    background: #F0E0D6;
    border-radius: 10px;
    height: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 10px;
    background: linear-gradient(90deg, #FF8C42, #FF6B8A, #C084FC);
    transition: width 0.5s ease;
  }

  /* ===== TASK CARD ===== */
  .section-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .task-card {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255,255,255,0.6);
    display: flex;
    gap: 12px;
    align-items: flex-start;
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
  }
  .task-card:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(255,140,66,0.18); }
  .task-card.completed {
    opacity: 0.55;
    background: rgba(255,255,255,0.5);
  }
  .task-card.completed .task-text { text-decoration: line-through; }

  .task-check {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2.5px solid #FFB3A0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    margin-top: 2px;
  }
  .task-card.completed .task-check {
    background: linear-gradient(135deg, #FF8C42, #FF6B8A);
    border-color: transparent;
  }
  .task-check svg { display: none; }
  .task-card.completed .task-check svg { display: block; }

  .task-content { flex: 1; min-width: 0; }
  .task-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 8px;
    margin-bottom: 4px;
  }
  .tag-morning { background: #FFF0E0; color: #E07B20; }
  .tag-afternoon { background: #FFE8E0; color: #D05530; }
  .tag-politics { background: #FFE0E0; color: #CC3333; }
  .tag-english { background: #E0EFFF; color: #3366CC; }
  .tag-buffer { background: #F0E8FF; color: #8855CC; }

  .task-text {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-primary);
    word-break: break-word;
  }

  /* ===== OVERDUE SECTION ===== */
  .overdue-section {
    margin-bottom: 20px;
  }
  .overdue-section .section-title {
    color: #E05555;
  }
  .overdue-card {
    border-left: 4px solid #FF6B8A;
  }
  .overdue-date {
    font-size: 10px;
    color: #FF6B8A;
    font-weight: 600;
    margin-bottom: 2px;
  }

  /* ===== EMPTY STATE ===== */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
  }
  .empty-state .emoji {
    font-size: 48px;
    margin-bottom: 12px;
  }
  .empty-state p {
    font-size: 14px;
    line-height: 1.6;
  }

  /* ===== MOTIVATIONAL ===== */
  .motivation {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 20px;
    margin-top: 16px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255,255,255,0.6);
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.8;
  }
  .motivation .quote { font-style: italic; color: var(--sunset-pink); font-weight: 600; }

  /* ===== ALL DONE ===== */
  .all-done {
    text-align: center;
    padding: 40px 20px;
  }
  .all-done .emoji { font-size: 56px; margin-bottom: 10px; }
  .all-done p { font-size: 15px; color: var(--text-secondary); }
  .all-done .big { font-size: 18px; font-weight: 700; color: var(--sunset-pink); }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 500px) {
    .container { padding: 10px; }
    .date-nav { padding: 10px 12px; }
    .task-card { padding: 12px 14px; }
    .countdown-chip .num { font-size: 22px; }
    .countdown-chip { padding: 6px 12px; }
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #FFB3A0; border-radius: 3px; }
</style>

// ===== STORAGE =====
function getStorageKey(dateStr, idx) {
  return `yuanbao_task_${dateStr}_${idx}`;
}

function isTaskCompleted(dateStr, idx) {
  return localStorage.getItem(getStorageKey(dateStr, idx)) === '1';
}

function toggleTask(dateStr, idx) {
  const key = getStorageKey(dateStr, idx);
  if (localStorage.getItem(key) === '1') {
    localStorage.removeItem(key);
  } else {
    localStorage.setItem(key, '1');
  }
  render();
}

// ===== HELPERS =====
function formatDate(d) {
  const m = d.getMonth() + 1;
  const day = d.getDate();
  return `${m}月${day}日`;
}

function dateToStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getWeekday(d) {
  const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  return days[d.getDay()];
}

function isToday(d) {
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
}

function daysBetween(a, b) {
  return Math.floor((b - a) / (1000 * 60 * 60 * 24));
}

// ===== RENDER =====
function render() {
  const dateStr = dateToStr(currentDate);
  const tasks = PLAN_DATA[dateStr] || [];

  // Update header counters
  const now = new Date();
  const todayNorm = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const daysToExam = daysBetween(todayNorm, EXAM_DATE);
  document.getElementById('countdown-days').textContent = daysToExam > 0 ? daysToExam : 0;

  const daysStudied = daysBetween(START_DATE, todayNorm);
  document.getElementById('study-days').textContent = Math.max(0, daysStudied);

  // Count total completed tasks
  let totalChecked = 0;
  for (const key in localStorage) {
    if (key.startsWith('yuanbao_task_') && localStorage[key] === '1') totalChecked++;
  }
  document.getElementById('total-checked').textContent = totalChecked;

  // Update date display
  document.getElementById('main-date').textContent = `${currentDate.getFullYear()}年${formatDate(currentDate)}`;
  const weekday = getWeekday(currentDate);
  const todayLabel = isToday(currentDate) ? ' · 今天' : '';
  document.getElementById('weekday').textContent = weekday + todayLabel;

  // Update progress
  let completed = 0;
  tasks.forEach((t, i) => { if (isTaskCompleted(dateStr, i)) completed++; });
  const total = tasks.length;
  document.getElementById('progress-count').textContent = `${completed}/${total}`;
  document.getElementById('progress-fill').style.width = total > 0 ? `${(completed / total) * 100}%` : '0%';

  // Render tasks
  const taskList = document.getElementById('task-list');
  if (tasks.length === 0) {
    // Check if date is in range
    const allDates = Object.keys(PLAN_DATA).sort();
    const first = allDates[0];
    const last = allDates[allDates.length - 1];
    if (dateStr < first || dateStr > last) {
      taskList.innerHTML = `<div class="empty-state"><div class="emoji">📅</div><p>这一天暂时还没有安排哦～<br>v3计划覆盖 4月21日 到 7月31日</p></div>`;
    } else {
      taskList.innerHTML = `<div class="empty-state"><div class="emoji">🌸</div><p>今天没有安排任务<br>好好休息，养精蓄锐～</p></div>`;
    }
    document.getElementById('tasks-title').textContent = '📝 当日任务';
  } else {
    let allDone = completed === total;
    if (allDone) {
      taskList.innerHTML = `<div class="all-done"><div class="emoji">🎉</div><p class="big">全部完成啦！</p><p>今天的任务都搞定了，太棒了！<br>点击任务可以取消打卡</p></div>`;
    } else {
      taskList.innerHTML = '';
    }

    tasks.forEach((task, idx) => {
      const done = isTaskCompleted(dateStr, idx);
      if (allDone && done) return; // We showed the all-done message

      const tagInfo = TAG_CONFIG[task.tag] || { label: task.tag, cls: 'tag-buffer' };
      const card = document.createElement('div');
      card.className = `task-card${done ? ' completed' : ''}`;
      card.onclick = () => toggleTask(dateStr, idx);

      const textHtml = task.text.replace(/\n/g, '<br>');
      card.innerHTML = `
        <div class="task-check">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div class="task-content">
          <span class="task-tag ${tagInfo.cls}">${tagInfo.label}</span>
          <div class="task-text">${textHtml}</div>
        </div>
      `;
      taskList.appendChild(card);
    });

    // If all done, re-render completed tasks below so they can be unchecked
    if (allDone) {
      tasks.forEach((task, idx) => {
        const tagInfo = TAG_CONFIG[task.tag] || { label: task.tag, cls: 'tag-buffer' };
        const card = document.createElement('div');
        card.className = 'task-card completed';
        card.onclick = () => toggleTask(dateStr, idx);
        const textHtml = task.text.replace(/\n/g, '<br>');
        card.innerHTML = `
          <div class="task-check">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div class="task-content">
            <span class="task-tag ${tagInfo.cls}">${tagInfo.label}</span>
            <div class="task-text">${textHtml}</div>
          </div>
        `;
        taskList.appendChild(card);
      });
    }

    document.getElementById('tasks-title').textContent = isToday(currentDate) ? '📝 今日任务' : `📝 ${formatDate(currentDate)}的任务`;
  }

  // Render overdue tasks (only show when viewing today)
  const overdueSection = document.getElementById('overdue-section');
  const overdueList = document.getElementById('overdue-list');
  if (isToday(currentDate)) {
    const overdueTasks = [];
    const allDates = Object.keys(PLAN_DATA).sort();
    for (const d of allDates) {
      if (d >= dateStr) break;
      const dayTasks = PLAN_DATA[d];
      dayTasks.forEach((task, idx) => {
        if (!isTaskCompleted(d, idx)) {
          overdueTasks.push({ date: d, task, idx });
        }
      });
    }

    if (overdueTasks.length > 0) {
      overdueSection.style.display = 'block';
      overdueList.innerHTML = '';
      overdueTasks.forEach(item => {
        const tagInfo = TAG_CONFIG[item.task.tag] || { label: item.task.tag, cls: 'tag-buffer' };
        const done = isTaskCompleted(item.date, item.idx);
        const card = document.createElement('div');
        card.className = `task-card overdue-card${done ? ' completed' : ''}`;
        card.onclick = () => toggleTask(item.date, item.idx);
        const d = new Date(item.date);
        const dateLabel = `${d.getMonth()+1}月${d.getDate()}日`;
        const textHtml = item.task.text.replace(/\n/g, '<br>');
        card.innerHTML = `
          <div class="task-check">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div class="task-content">
            <div class="overdue-date">📌 ${dateLabel}</div>
            <span class="task-tag ${tagInfo.cls}">${tagInfo.label}</span>
            <div class="task-text">${textHtml}</div>
          </div>
        `;
        overdueList.appendChild(card);
      });
    } else {
      overdueSection.style.display = 'none';
    }
  } else {
    overdueSection.style.display = 'none';
  }

  // Motivation
  document.getElementById('motivation').innerHTML = `<span class="quote">"${getMotivation()}"</span>`;
}

// ===== NAVIGATION =====
function changeDate(delta) {
  currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() + delta);
  render();
}

function goToday() {
  const now = new Date();
  currentDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  render();
}

// ===== INIT =====
render();

// ===== SWIPE SUPPORT =====
let touchStartX = 0;
let touchEndX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
document.addEventListener('touchend', e => {
  touchEndX = e.changedTouches[0].screenX;
  const diff = touchStartX - touchEndX;
  if (Math.abs(diff) > 80) {
    if (diff > 0) changeDate(1);
    else changeDate(-1);
  }
}, { passive: true });

// ===== KEYBOARD SUPPORT =====
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') changeDate(-1);
  if (e.key === 'ArrowRight') changeDate(1);
  if (e.key === 'Home') goToday();
});
</script>
</body>
</html>
